<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DSLO v0.7 Graph Viewer</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    svg { width: 100vw; height: 100vh; background: #f7f7f7; }
    .node circle { stroke: #333; stroke-width: 1.5px; }
    .node text { font-size: 10px; pointer-events: none; }
    .link { stroke: #999; stroke-opacity: 0.6; }
  </style>
</head>
<body>
  <svg></svg>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const svg = d3.select("svg");
    const width = window.innerWidth;
    const height = window.innerHeight;

    Promise
      .all([
        fetch("glossary_v0.7_graph.json").then(r => r.json())
      ])
      .then(([graph]) => {
        // Build node list from sections
        const nodes = [];
        graph.sections.forEach(sec => {
          nodes.push({ id: sec.id, label: sec.name, type: "section" });
          (sec.nodes || []).forEach(n => {
            nodes.push({ id: sec.id + ":" + n, label: n, type: "node", section: sec.id });
          });
        });

        // Build links from edges (section-level)
        const links = graph.edges.map(e => ({
          source: e.from,
          target: e.to,
          type: e.type
        }));

        const simulation = d3.forceSimulation(nodes)
          .force("link", d3.forceLink(links).id(d => d.id).distance(d => d.type === "section" ? 80 : 40))
          .force("charge", d3.forceManyBody().strength(-60))
          .force("center", d3.forceCenter(width / 2, height / 2));

        const link = svg.append("g")
          .attr("stroke-width", 1)
          .selectAll("line")
          .data(links)
          .enter().append("line")
          .attr("class", "link");

        const node = svg.append("g")
          .selectAll("g")
          .data(nodes)
          .enter().append("g")
          .attr("class", "node")
          .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended));

        node.append("circle")
          .attr("r", d => d.type === "section" ? 10 : 4)
          .attr("fill", d => d.type === "section" ? "#ffcc66" : "#66a3ff");

        node.append("text")
          .attr("x", 8)
          .attr("y", 3)
          .text(d => d.label);

        simulation.on("tick", () => {
          link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

          node
            .attr("transform", d => `translate(${d.x},${d.y})`);
        });

        function dragstarted(event, d) {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x;
          d.fy = d.y;
        }

        function dragged(event, d) {
          d.fx = event.x;
          d.fy = event.y;
        }

        function dragended(event, d) {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null;
          d.fy = null;
        }
      });
  </script>
</body>
</html>
